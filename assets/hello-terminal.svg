<svg xmlns="http://www.w3.org/2000/svg" width="660" height="206" viewBox="0 0 660 206" role="img" aria-labelledby="title desc">
<title id="title">Alberto: dev, professor de cursos técnicos e eterno aprendiz</title>
<desc id="desc">Terminal com apresentação digitada: Alberto em Belém, professor de cursos técnicos e eterno aprendiz no doutorado.</desc>
<style>
text { font-family: ui-monospace, "Cascadia Code", "DejaVu Sans Mono", monospace; }
.reveal { transform-origin: 0 0; }
.one { animation: one 20s steps(44,end) infinite; }
.two { animation: two 20s steps(44,end) infinite; }
.three { animation: three 20s steps(44,end) infinite; }
.cursor { animation: blink 1.4s steps(1,end) infinite; }
@keyframes one { 0%,3% {transform:scaleX(0)} 22%,96% {transform:scaleX(1)} 100% {transform:scaleX(0)} }
@keyframes two { 0%,24% {transform:scaleX(0)} 45%,96% {transform:scaleX(1)} 100% {transform:scaleX(0)} }
@keyframes three { 0%,48% {transform:scaleX(0)} 76%,96% {transform:scaleX(1)} 100% {transform:scaleX(0)} }
@keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }
@media (prefers-reduced-motion: reduce) { .reveal, .cursor {animation:none;} }
</style>
<defs>
<clipPath id="line1"><rect class="reveal one" width="615" height="206"/></clipPath>
<clipPath id="line2"><rect class="reveal two" width="615" height="206"/></clipPath>
<clipPath id="line3"><rect class="reveal three" width="615" height="206"/></clipPath>
</defs>
<rect x="1" y="1" width="658" height="204" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<path d="M1 42H659" stroke="#30363d"/>
<circle cx="23" cy="22" r="5.5" fill="#ff7b72"/><circle cx="43" cy="22" r="5.5" fill="#e3b341"/><circle cx="63" cy="22" r="5.5" fill="#3fb950"/>
<text x="91" y="27" font-size="13" fill="#8b949e">alberto@localhost: ~</text>
<text x="25" y="73" font-size="17" fill="#7ee787">$ whoami</text>
<g transform="translate(25 0)" font-size="17">
<text clip-path="url(#line1)" x="0" y="105" fill="#e6edf3">Alberto · dev em Belém/PA</text>
<text clip-path="url(#line2)" x="0" y="136" fill="#79c0ff">Professor de cursos técnicos</text>
<text clip-path="url(#line3)" x="0" y="167" fill="#d2a8ff">Eterno aprendiz · doutorado em andamento</text>
</g>
<text class="cursor" x="25" y="191" font-size="17" fill="#7ee787">▍</text>
